<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Activity Partner Search &amp; Filters Drawer - HobbyLink</title>

<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>

            "secondary-container": "#ff9800",
            "on-secondary-fixed-variant": "#693c00",

            "on-primary-container": "#fffbff",

            "surface": "#fcf9f8",

            "body-sm": ["12px", { "lineHeight": "16px", "fontWeight": "400" }],

<style>
    .material-symbols-outlined {
      font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    /* Slider Range Custom Styling */
    input[type=range]::-webkit-slider-thumb {
      -webkit-appearance: none;
      height: 22px;
      width: 22px;
      border-radius: 50%;
      background: #b7131a;
      border: 3px solid #ffffff;
      box-shadow: 0px 2px 5px rgba(0,0,0,0.25);
      cursor: pointer;
    }
    input[type=range]::-moz-range-thumb {
      height: 22px;
      width: 22px;
      border-radius: 50%;
      background: #b7131a;
      border: 3px solid #ffffff;
      box-shadow: 0px 2px 5px rgba(0,0,0,0.25);
      cursor: pointer;
    }
    /* Hide scrollbars for clean presentation */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-inverse-surface/40 text-on-surface font-body-md antialiased min-h-screen flex justify-center items-end sm:items-center">
<!-- Mobile Sheet Container (Max Width 440px mimicking native drawer) -->
<main class="w-full max-w-[440px] bg-surface-container-lowest h-[830px] max-h-[880px] rounded-t-[28px] sm:rounded-[28px] shadow-2xl flex flex-col overflow-hidden relative border border-surface-container-high">
<!-- Grabber Handle for Drawer Affordance -->
<div class="w-full pt-space-xs pb-space-2xs flex justify-center items-center">
<div class="w-10 h-1.5 bg-surface-variant rounded-full"></div>
</div>
<!-- Top Bar / Header -->
<header class="flex justify-between items-center px-margin-mobile py-space-xs border-b border-surface-container shrink-0">
<div class="flex items-center space-x-space-xs">
<button aria-label="Close" class="w-touch-target-min h-touch-target-min flex items-center justify-center rounded-full hover:bg-surface-container active:scale-95 transition-transform duration-150 text-on-surface" type="button">
<span class="material-symbols-outlined text-[24px]">close</span>
</button>
<h1 class="font-headline-sm text-headline-sm text-on-surface font-bold">Search Filters</h1>
</div>
<button class="h-touch-target-min px-space-xs flex items-center justify-center font-label-md text-label-md font-bold text-primary active:scale-95 transition-transform duration-150 hover:bg-primary-fixed/30 rounded-lg" type="button">
        Reset All
      </button>
</header>
<!-- Scrollable Filter Controls Body -->
<div class="flex-1 overflow-y-auto px-margin-mobile py-space-md space-y-space-lg no-scrollbar pb-space-2xl">
<!-- 1. Distance Radius Section -->
<section class="space-y-space-xs">
<div class="flex justify-between items-baseline">
<label class="font-label-lg text-label-lg text-on-surface font-bold">Distance Radius</label>
<span class="font-label-md text-label-md font-bold text-primary bg-primary-fixed px-space-xs py-0.5 rounded-full">Within 5 km</span>
</div>
<div class="pt-space-xs pb-space-2xs">
<input class="w-full h-2 bg-surface-container-highest rounded-lg appearance-none cursor-pointer accent-primary" max="6" min="1" type="range" value="2"/>
<div class="flex justify-between items-center text-on-surface-variant font-label-sm text-label-sm mt-space-xs px-1">
<span class="font-bold text-primary">1km</span>
<span class="font-bold text-primary">5km</span>
<span>10km</span>
<span>25km</span>
<span>50km</span>
<span>All</span>
</div>
</div>
</section>
<hr class="border-surface-container-high my-space-xs"/>
<!-- 2. Age Range Dual-Slider Section -->
<section class="space-y-space-xs">
<div class="flex justify-between items-baseline">
<label class="font-label-lg text-label-lg text-on-surface font-bold">Age Range</label>
<span class="font-label-md text-label-md font-bold text-primary bg-surface-container-low border border-outline-variant px-space-xs py-0.5 rounded-full">21 - 32 years old</span>
</div>
<div class="relative pt-space-xs pb-space-2xs">
<!-- Multi-slider track visualization -->
<div class="w-full h-2 bg-surface-container-highest rounded-lg relative overflow-hidden">
<div class="absolute left-[12%] right-[55%] h-full bg-primary rounded-lg"></div>
</div>
<!-- Mock Dual Thumb sliders -->
<div class="relative -mt-3 flex justify-between pointer-events-none px-[10%]">
<div class="w-5 h-5 rounded-full bg-primary border-2 border-surface-container-lowest shadow pointer-events-auto cursor-grab"></div>
<div class="w-5 h-5 rounded-full bg-primary border-2 border-surface-container-lowest shadow pointer-events-auto cursor-grab"></div>
</div>
<div class="flex justify-between items-center text-on-surface-variant font-label-sm text-label-sm mt-space-xs">
<span>18 yrs</span>
<span>65+ yrs</span>
</div>
</div>
</section>
<hr class="border-surface-container-high my-space-xs"/>
<!-- 3. Gender Preference Segmented Buttons -->
<section class="space-y-space-xs">
<label class="font-label-lg text-label-lg text-on-surface font-bold block">Gender Preference</label>
<div class="grid grid-cols-3 p-1 bg-surface-container rounded-xl gap-1">
<!-- Active 'All' -->
<button class="h-10 flex items-center justify-center rounded-lg bg-primary text-on-primary font-label-md text-label-md font-bold shadow-sm transition-transform active:scale-95" type="button">
            All
          </button>
<!-- Inactive 'Male' -->
<button class="h-10 flex items-center justify-center rounded-lg text-on-surface-variant hover:text-on-surface font-label-md text-label-md font-medium hover:bg-surface-container-lowest transition-transform active:scale-95" type="button">
            Male
          </button>
<!-- Inactive 'Female' -->
<button class="h-10 flex items-center justify-center rounded-lg text-on-surface-variant hover:text-on-surface font-label-md text-label-md font-medium hover:bg-surface-container-lowest transition-transform active:scale-95" type="button">
            Female
          </button>
</div>
</section>
<hr class="border-surface-container-high my-space-xs"/>
<!-- 4. Minimum Trust & Safety Rating (FR-25) -->
<section class="space-y-space-xs">
<div class="flex items-center justify-between">
<div class="flex items-center space-x-1.5">
<span class="material-symbols-outlined text-[18px] text-tertiary" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<label class="font-label-lg text-label-lg text-on-surface font-bold">Minimum Trust &amp; Safety Rating</label>
</div>
<span class="font-label-sm text-label-sm text-on-surface-variant">FR-25 Verified</span>
</div>
<div class="space-y-space-xs pt-space-2xs">
<!-- Any Pill -->
<button class="w-full min-h-[44px] px-space-md py-space-xs flex items-center justify-between rounded-xl border border-surface-container-high bg-surface hover:bg-surface-container-low transition-colors" type="button">
<span class="font-label-md text-label-md text-on-surface font-medium">Any Rating</span>
<div class="w-5 h-5 rounded-full border border-outline flex items-center justify-center"></div>
</button>
<!-- 4.0+ Pill -->
<button class="w-full min-h-[44px] px-space-md py-space-xs flex items-center justify-between rounded-xl border border-surface-container-high bg-surface hover:bg-surface-container-low transition-colors" type="button">
<div class="flex items-center space-x-space-xs">
<span class="text-secondary-container">★</span>
<span class="font-label-md text-label-md text-on-surface font-medium">4.0+ Stars</span>
</div>
<div class="w-5 h-5 rounded-full border border-outline flex items-center justify-center"></div>
</button>
<!-- 4.5+ Selected Highly Trusted Pill -->
<button class="w-full min-h-[48px] px-space-md py-space-xs flex items-center justify-between rounded-xl border-2 border-primary bg-primary-fixed/20 shadow-sm transition-colors" type="button">
<div class="flex items-center space-x-space-xs">
<span class="text-secondary-container">★</span>
<div class="flex flex-col text-left">
<span class="font-label-md text-label-md font-bold text-on-surface">4.5+ Stars</span>
<span class="font-label-sm text-label-sm text-tertiary font-bold flex items-center gap-1">
<span class="w-1.5 h-1.5 rounded-full bg-tertiary"></span> Highly Trusted - Recommended
                </span>
</div>
</div>
<div class="w-5 h-5 rounded-full bg-primary flex items-center justify-center text-on-primary">
<span class="material-symbols-outlined text-[16px]">check</span>
</div>
</button>
</div>
</section>
<hr class="border-surface-container-high my-space-xs"/>
<!-- 5. Activity Category & Tags -->
<section class="space-y-space-xs">
<label class="font-label-lg text-label-lg text-on-surface font-bold block">Activity Category &amp; Tags</label>
<div class="flex flex-wrap gap-2 pt-1">
<!-- Selected Chip 1: Paddle Tennis -->
<button class="h-9 px-space-md rounded-full bg-primary text-on-primary font-label-md text-label-md font-semibold flex items-center space-x-1.5 shadow-sm active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined text-[18px]">sports_tennis</span>
<span>Paddle Tennis</span>
<span class="material-symbols-outlined text-[16px]">close</span>
</button>
<!-- Selected Chip 2: Running -->
<button class="h-9 px-space-md rounded-full bg-primary text-on-primary font-label-md text-label-md font-semibold flex items-center space-x-1.5 shadow-sm active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined text-[18px]">directions_run</span>
<span>Running</span>
<span class="material-symbols-outlined text-[16px]">close</span>
</button>
<!-- Inactive Chip 3: Specialty Coffee -->
<button class="h-9 px-space-md rounded-full bg-surface-container text-on-surface-variant hover:bg-surface-container-high font-label-md text-label-md font-medium flex items-center space-x-1.5 active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined text-[18px]">coffee</span>
<span>Specialty Coffee</span>
</button>
<!-- Inactive Chip 4: Board Games -->
<button class="h-9 px-space-md rounded-full bg-surface-container text-on-surface-variant hover:bg-surface-container-high font-label-md text-label-md font-medium flex items-center space-x-1.5 active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined text-[18px]">casino</span>
<span>Board Games</span>
</button>
<!-- Inactive Chip 5: Gym & Fitness -->
<button class="h-9 px-space-md rounded-full bg-surface-container text-on-surface-variant hover:bg-surface-container-high font-label-md text-label-md font-medium flex items-center space-x-1.5 active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined text-[18px]">fitness_center</span>
<span>Gym &amp; Fitness</span>
</button>
<!-- Inactive Chip 6: Hiking -->
<button class="h-9 px-space-md rounded-full bg-surface-container text-on-surface-variant hover:bg-surface-container-high font-label-md text-label-md font-medium flex items-center space-x-1.5 active:scale-95 transition-transform" type="button">
<span class="material-symbols-outlined text-[18px]">hiking</span>
<span>Hiking</span>
</button>
</div>
</section>
<hr class="border-surface-container-high my-space-xs"/>
<!-- 6. Online Availability Status -->
<section class="space-y-space-md">
<label class="font-label-lg text-label-lg text-on-surface font-bold block">Online Availability Status</label>
<!-- Toggle 1: Active Now (Online) -->
<div class="flex items-center justify-between p-space-xs rounded-xl hover:bg-surface-container-low transition-colors">
<div class="flex items-center space-x-space-sm">
<div class="relative w-3.5 h-3.5">
<span class="absolute inset-0 rounded-full bg-tertiary animate-ping opacity-75"></span>
<span class="relative block w-3.5 h-3.5 rounded-full bg-tertiary"></span>
</div>
<div>
<p class="font-label-lg text-label-lg text-on-surface font-semibold">Active Now (Online)</p>
<p class="font-body-sm text-body-sm text-on-surface-variant">Partners browsing activities right now</p>
</div>
</div>
<!-- Toggle Active Switch -->
<button aria-checked="true" class="w-12 h-7 bg-primary rounded-full p-0.5 flex items-center justify-end transition-colors focus:outline-none" role="switch" type="button">
<div class="w-6 h-6 bg-on-primary rounded-full shadow-md"></div>
</button>
</div>
<!-- Toggle 2: Ready within 1 hour (Live Radar) -->
<div class="flex items-center justify-between p-space-xs rounded-xl hover:bg-surface-container-low transition-colors">
<div class="flex items-center space-x-space-sm">
<div class="w-3.5 h-3.5 rounded-full bg-secondary-container"></div>
<div>
<p class="font-label-lg text-label-lg text-on-surface font-semibold">Ready within 1 hour (Live Radar)</p>
<p class="font-body-sm text-body-sm text-on-surface-variant">Immediate meetup availability nearby</p>
</div>
</div>
<!-- Toggle Inactive Switch -->
<button aria-checked="false" class="w-12 h-7 bg-surface-variant rounded-full p-0.5 flex items-center justify-start transition-colors focus:outline-none" role="switch" type="button">
<div class="w-6 h-6 bg-on-primary rounded-full shadow-md"></div>
</button>
</div>
</section>
</div>
<!-- Bottom Fixed Dock (Primary Call to Action) -->
<footer class="p-margin-mobile bg-surface-container-lowest border-t border-surface-container shadow-lg shrink-0">
<button class="w-full h-touch-target-min bg-primary hover:bg-primary-container active:scale-[0.98] text-on-primary font-label-lg text-label-lg font-bold rounded-xl shadow-md transition-all flex items-center justify-center space-x-2" type="button">
<span class="material-symbols-outlined text-[20px]">filter_alt</span>
<span>Apply Filters (14 Partners Found)</span>
</button>
</footer>
</main>
</body></html>
