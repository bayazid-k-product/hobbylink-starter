<style>

    @keyframes fillProgress {
      0% {

      }

<!-- Dynamic Progress Label Micro-interaction Script -->
<script>
    document.addEventListener('DOMContentLoaded', () => {
      const statusElement = document.getElementById('load-status');
      const percentElement = document.getElementById('load-percent');

      const milestones = [
        { time: 200, status: 'Initializing mesh network...', percent: '18%' },
        { time: 700, status: 'Locating shared passions...', percent: '46%' },
        { time: 1300, status: 'Syncing local beacons...', percent: '84%' },
        { time: 1900, status: 'Ready to connect!', percent: '100%' }
      ];

      milestones.forEach(({ time, status, percent }) => {
        setTimeout(() => {
          if (statusElement) statusElement.textContent = status;
          if (percentElement) percentElement.textContent = percent;
        }, time);
      });
    });
  </script>
